<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Александр Песковский — 2026</title>
  <meta name="description" content="Александр Песковский — Разнорабочий в медиа (2026). Видео (Снято на iPhone) и Креатив.">
  
  <!-- Шрифты: Space Grotesk и JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
  
  <!-- Стили -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="notebook-grid">

  <!-- ==========================================
       ХЕДЕР: АЛЕКСАНДР ПЕСКОВСКИЙ И ДВЕ КНОПКИ СВЯЗИ
       ========================================== -->
  <header class="site-header">
    <div class="container header-row">
      <div>
        <h1 class="brand-name">Александр Песковский</h1>
        <span class="brand-label">Разнорабочий в медиа • 2026</span>
      </div>

      <div class="header-actions">
        <!-- Только две фирменные кнопки Apple: Email и Instagram -->
        <a href="mailto:peskovsky18@gmail.com" class="apple-pill-btn apple-pill-primary action-email-btn">
          <svg class="pill-icon" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          <span>Email</span>
        </a>

        <a href="https://instagram.com/peskovsky18" target="_blank" rel="noopener" class="apple-pill-btn action-insta-btn">
          <svg class="pill-icon" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
          <span>Instagram ↗</span>
        </a>

        <button id="theme-toggle" class="apple-pill-btn theme-pill-btn" aria-label="Сменить тему">
          🌙
        </button>
      </div>
    </div>
  </header>

  <main>
    <!-- ==========================================
         ЦЕНТРАЛЬНЫЙ МОБИЛЬНЫЙ ФРЕЙМ IOS (ГАЛЕРЕЯ)
         ========================================== -->
    <section class="ios-stage-wrapper">
      <div class="ios-phone-frame">
        
        <!-- Статус-бар iOS: 9:41 и Dynamic Island -->
        <div class="ios-status-bar">
          <span class="ios-time">9:41</span>
          <div class="ios-dynamic-island"></div>
          <div class="ios-status-icons">
            <svg width="15" height="11" viewBox="0 0 16 12" fill="currentColor"><path d="M1 8.5C2.5 7 4.5 6 8 6s5.5 1 7 2.5M3 11C4.5 9.5 6 9 8 9s3.5.5 5 2M8 12a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/></svg>
            <svg width="18" height="10" viewBox="0 0 22 12" fill="currentColor"><rect x="1" y="1" width="18" height="10" rx="3" stroke="currentColor" stroke-width="1.5" fill="none"/><rect x="3" y="3" width="12" height="6" rx="1.5"/><path d="M21 4.5v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </div>
        </div>

        <!-- Заголовок раздела внутри iOS Photos -->
        <div class="ios-photos-header">
          <div class="ios-photos-title" id="ios-photos-title">Видео</div>
          <div class="ios-photos-count" id="ios-photos-count">1 из 4 • 2026</div>
        </div>

        <!-- Контент экрана -->
        <div class="ios-screen-content">
          <!-- Главная карточка работы -->
          <div class="ios-main-card" id="ios-main-card" title="Нажмите, чтобы воспроизвести">
            <img id="ios-card-img" class="ios-card-img" src="" alt="Работа">
            
            <!-- Подпись «Снято на iPhone» прямо на кадре -->
            <div class="shot-on-iphone-pill" id="shot-badge">Снято на iPhone • ProRes Log</div>

            <!-- Иконка Play -->
            <div class="ios-play-bubble">
              <div class="ios-play-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
              </div>
            </div>

            <!-- Стрелки листания внутри кадра -->
            <button class="ios-card-nav-arrow ios-arrow-prev" id="ios-prev-arrow" aria-label="Предыдущий">‹</button>
            <button class="ios-card-nav-arrow ios-arrow-next" id="ios-next-arrow" aria-label="Следующий">›</button>
          </div>

          <!-- Лента кадров (Filmstrip Scrubber в стиле iOS) -->
          <div class="ios-filmstrip" id="ios-filmstrip">
            <!-- Миниатюры генерируются автоматически -->
          </div>

          <!-- Детали работы и технические спеки -->
          <div class="ios-work-details">
            <div class="ios-work-meta-top">
              <span class="ios-work-cat-badge" id="work-cat-badge">Видео</span>
              <span class="ios-work-year" id="work-year">2026</span>
            </div>
            <h2 class="ios-work-title" id="work-title">Загрузка...</h2>
            <div class="ios-work-role" id="work-role">—</div>

            <!-- Архитектурные спеки кадра -->
            <div class="ios-work-specs-box" id="work-specs-box">
              <!-- Заполняется main.js -->
            </div>
          </div>
        </div>

        <!-- Парящая капсула снизу (Floating Tab Bar: всего 2 раздела) -->
        <div class="ios-tab-bar-container">
          <nav class="ios-floating-tab-bar" aria-label="Разделы портфолио">
            <button class="ios-tab-pill active" data-tab="video">
              <span>🎬 Видео</span>
            </button>
            <button class="ios-tab-pill" data-tab="creative">
              <span>✦ Креатив</span>
            </button>
          </nav>
        </div>

        <!-- Home Indicator полоска iPhone -->
        <div class="ios-home-indicator"></div>

      </div>
    </section>

    <!-- ==========================================
         НИЖНИЙ БЛОК: ТОЛЬКО ДВЕ КНОПКИ СВЯЗИ
         ========================================== -->
    <section class="container bottom-contact-bar">
      <div class="contact-pill-group">
        <a href="mailto:peskovsky18@gmail.com" class="apple-pill-btn apple-pill-primary action-email-btn">
          <svg class="pill-icon" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          <span>Написать на Email</span>
        </a>

        <a href="https://instagram.com/peskovsky18" target="_blank" rel="noopener" class="apple-pill-btn action-insta-btn">
          <svg class="pill-icon" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
          <span>Instagram @peskovsky18 ↗</span>
        </a>
      </div>

      <div class="site-footer">
        © 2026 Александр Песковский • Разнорабочий в медиа
      </div>
    </section>
  </main>

  <!-- ==========================================
       МОДАЛЬНОЕ ОКНО ПРОСМОТРА ВИДЕО
       ========================================== -->
  <div class="modal-overlay" id="project-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <div class="modal-header">
        <span class="ios-work-cat-badge" id="modal-header-cat">Проект</span>
        <button class="modal-close-pill" id="modal-close-btn" aria-label="Закрыть">✕</button>
      </div>
      <div class="modal-body">
        <div id="modal-media-container"></div>
        <div style="margin-top: 14px;">
          <h2 class="ios-work-title" id="modal-title" style="font-size: 1.3rem;">Название</h2>
          <p id="modal-desc" style="font-size: 0.9rem; color: var(--text-muted); margin-top: 6px;">Описание</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Скрипты -->
  <script src="js/projects-data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
