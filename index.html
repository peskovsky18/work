<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Александр Песковский — Разнорабочий в медиа</title>
  <meta name="description" content="Портфолио: Александр Песковский — Разнорабочий в медиа. Видео, фотография, монтаж, веб-проекты.">
  
  <!-- Шрифты Google Fonts: Space Grotesk и JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
  
  <!-- Стили -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="notebook-grid">

  <!-- ==========================================
       ХЕДЕР: ИМЯ, РОЛЬ И ДВЕ КНОПКИ
       ========================================== -->
  <header class="site-header">
    <div class="container header-row">
      <div class="brand-info">
        <h1 class="brand-name" id="brand-name">Александр Песковский</h1>
        <div class="brand-role" id="brand-role">Разнорабочий в медиа</div>
      </div>

      <div class="header-actions">
        <!-- Только две кнопки: Почта и Инст -->
        <a href="mailto:peskovsky18@gmail.com" class="btn btn-primary action-email-btn">Email</a>
        <a href="https://instagram.com/peskovsky18" target="_blank" rel="noopener" class="btn action-insta-btn">Instagram ↗</a>
        <button id="theme-toggle" class="btn theme-btn" aria-label="Сменить тему">🌙</button>
      </div>
    </div>
  </header>

  <main>
    <!-- ==========================================
         СЕКЦИЯ КАРУСЕЛИ РАБОТ
         ========================================== -->
    <section class="carousel-section">
      <div class="container">
        <!-- Фильтры и счетчик -->
        <div class="filter-bar">
          <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">Все</button>
            <button class="filter-tab" data-filter="video">Видео</button>
            <button class="filter-tab" data-filter="photo">Фото</button>
            <button class="filter-tab" data-filter="montage">Монтаж</button>
            <button class="filter-tab" data-filter="web">Веб</button>
          </div>
          <div class="carousel-counter-top" id="carousel-counter-top">01 / 08</div>
        </div>

        <!-- Контейнер карусели -->
        <div class="carousel-wrapper">
          <!-- Главный экран работы (клик открывает видео / фото) -->
          <div class="carousel-viewport" id="carousel-viewport" title="Нажмите, чтобы открыть">
            <img id="carousel-img" class="carousel-image" src="" alt="Работа">
            <div class="carousel-overlay-hint">
              <span class="open-work-btn">Смотреть проект ↗</span>
            </div>
          </div>

          <!-- Информационная полоса работы -->
          <div class="carousel-info-bar">
            <div class="carousel-project-details">
              <div class="carousel-meta-row">
                <span class="carousel-category-badge" id="carousel-category-badge">Видео</span>
                <span id="carousel-year">2024</span>
              </div>
              <h2 class="carousel-title" id="carousel-title">Загрузка...</h2>
              <div class="carousel-role" id="carousel-role">—</div>
            </div>

            <!-- Стрелки карусели -->
            <div class="carousel-nav-controls">
              <button class="nav-arrow-btn" id="carousel-prev" aria-label="Предыдущий проект">←</button>
              <button class="nav-arrow-btn" id="carousel-next" aria-label="Следующий проект">→</button>
            </div>
          </div>
        </div>

        <!-- Полоса миниатюр для быстрого перехода -->
        <div class="carousel-thumbnails" id="carousel-thumbs">
          <!-- Миниатюры генерируются скриптом main.js -->
        </div>
      </div>
    </section>

    <!-- ==========================================
         БЛОК СВЯЗИ (ТОЛЬКО ДВЕ КНОПКИ)
         ========================================== -->
    <section class="contact-section">
      <div class="container">
        <div class="contact-row">
          <div class="contact-left">
            <div class="contact-heading">Связаться</div>
            <div class="contact-sub">Почта или личные сообщения</div>
          </div>

          <div class="contact-buttons-only">
            <a href="mailto:peskovsky18@gmail.com" class="btn btn-primary contact-btn-large action-email-btn">
              Написать на Email
            </a>
            <a href="https://instagram.com/peskovsky18" target="_blank" rel="noopener" class="btn contact-btn-large action-insta-btn">
              Instagram ↗
            </a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- ==========================================
       ПОДВАЛ
       ========================================== -->
  <footer class="container site-footer">
    <div>© 2024–2025 Александр Песковский</div>
    <div>Разнорабочий в медиа</div>
  </footer>

  <!-- ==========================================
       МОДАЛЬНОЕ ОКНО ПРОСМОТРА РАБОТЫ
       ========================================== -->
  <div class="modal-overlay" id="project-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-header-title">
          <span id="modal-header-cat">Проект</span>
        </div>
        <button class="modal-close-btn" id="modal-close-btn" aria-label="Закрыть">✕</button>
      </div>

      <div class="modal-content-scroll">
        <!-- Медиа (плеер YouTube / фотогалерея) -->
        <div id="modal-media-container"></div>

        <!-- Описание и детали -->
        <div style="display: flex; flex-direction: column; gap: 14px;">
          <h2 class="modal-title" id="modal-title">Название</h2>
          
          <div class="modal-meta-grid" id="modal-meta-container">
            <!-- Заполняется main.js -->
          </div>

          <div class="modal-desc" id="modal-desc">
            <!-- Описание -->
          </div>

          <div id="modal-tools-container">
            <!-- Инструменты -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Скрипты -->
  <script src="js/projects-data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
